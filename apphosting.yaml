# Firebase App Hosting 설정
# 문서: https://firebase.google.com/docs/app-hosting/configure
# App Hosting 이 GitHub(main 브랜치)에 연결되면, push 할 때마다 이 파일을 읽어
# `npm ci && npm run build` 로 Next.js 를 빌드하고 Cloud Run 에 SSR 로 배포합니다.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0      # 트래픽 없을 땐 0으로 내려가 비용 절감 (콜드스타트 허용)
  maxInstances: 10
  concurrency: 80

env:
  # ── 공개 Firebase 클라이언트 설정 (브라우저 번들에 노출되는 공개 키) ──
  # 빌드 시점에 클라이언트 코드에 주입되어야 하므로 BUILD availability 필요
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAqfNSNWx3AtLqUwoBRfNu3EcfqO2ZT77Y
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: withcomai-web.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: withcomai-web
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: withcomai-web.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "345857326079"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:345857326079:web:0ed48cf03928076b2645ca
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPER_ADMIN_EMAIL
    value: withcomai@gmail.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_RUNMOA_BASE_URL
    value: https://aish.runmoa.com
    availability: [BUILD, RUNTIME]

  # ── 서버 전용 비밀값 (Secret Manager 연동) ──
  # 아래는 서버 API(문의 메일 발송·AI·GitHub 이슈·시트 연동)가 동작하려면 필요합니다.
  # 비밀이므로 값을 직접 쓰지 않고 Secret Manager 에 등록 후 secret: 으로 참조합니다.
  # 등록 명령(예): firebase apphosting:secrets:set GEMINI_API_KEY
  # 등록 전에는 아래 주석을 풀면 빌드가 실패하므로, 시크릿을 만든 뒤 주석 해제하세요.
  #
  # - variable: GEMINI_API_KEY
  #   secret: GEMINI_API_KEY
  # - variable: SMTP_USER
  #   secret: SMTP_USER
  # - variable: SMTP_APP_PASSWORD
  #   secret: SMTP_APP_PASSWORD
  # - variable: ADMIN_NOTIFY_EMAIL
  #   secret: ADMIN_NOTIFY_EMAIL
  # - variable: GITHUB_TOKEN
  #   secret: GH_TOKEN
  # - variable: GITHUB_REPO
  #   secret: GH_REPO
  # - variable: GOOGLE_SHEETS_INQUIRY_SHEET_ID
  #   secret: GOOGLE_SHEETS_INQUIRY_SHEET_ID
  # - variable: GOOGLE_SHEETS_SERVICE_ACCOUNT_EMAIL
  #   secret: GOOGLE_SHEETS_SERVICE_ACCOUNT_EMAIL
  # - variable: GOOGLE_SHEETS_SERVICE_ACCOUNT_PRIVATE_KEY
  #   secret: GOOGLE_SHEETS_SERVICE_ACCOUNT_PRIVATE_KEY
  # - variable: CRON_SECRET
  #   secret: CRON_SECRET
